<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KejaHub - Landlord Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#EAEAEA] font-sans min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center w-full">
        <div class="flex items-center gap-2 text-black font-bold text-xl">
            <div class="flex items-center text-xl text-green-600">
                <i class="fa-solid fa-house-chimney text-cyan-600"></i>
            </div>
            <span class="tracking-tight">Keja<span class="text-cyan-500">Hub</span></span>
        </div>
        <div class="flex items-center gap-6 text-gray-700 text-sm font-medium">
            <i class="fa-regular fa-user text-xl"></i>
            <i class="fa-regular fa-envelope text-xl"></i>
            <i class="fa-regular fa-bell text-xl"></i>
        </div>
    </header>

    <div class="flex flex-1 w-full">
        <!-- Sidebar Navigation -->
        <aside class="w-16 bg-white border-r border-gray-200 flex flex-col items-center py-6 gap-8 shrink-0">
            <i class="fa-solid fa-house text-gray-700 text-xl"></i>
            <i class="fa-solid fa-gear text-gray-400 text-xl"></i>
            <i class="fa-solid fa-users text-gray-400 text-xl"></i>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 bg-white p-6 overflow-x-hidden">
            <!-- Welcome Banner -->
            <div class="bg-cyan-200 text-black font-bold px-6 py-3 flex justify-between items-center w-full mb-6 shadow-sm">
                <div class="text-lg" id="welcome-banner">Welcome Back Landlord!</div>
                <div class="text-sm uppercase tracking-wider">Landlord Dashboard</div>
            </div>

            <!-- Dashboard 3-Column Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-start">
                
                <!-- Column 1: Rent Stats & Quick Actions -->
                <div class="space-y-6">
                    <div class="flex flex-col items-center py-4 relative">
                        <div id="payment-pie-chart" class="w-48 h-48 rounded-full shadow-inner relative flex items-center justify-center border border-gray-200 transition-all duration-500">
                            <span class="absolute top-6 right-8 text-[10px] font-bold text-gray-800" id="pie-paid-label">Paid - 0%</span>
                            <span class="absolute bottom-10 left-6 text-[10px] font-bold text-gray-700" id="pie-pending-label">Pending - 100%</span>
                        </div>
                    </div>

                    <div class="bg-[#EDEDED] p-4 rounded-xl space-y-3 border border-gray-200">
                        <div>
                            <p class="text-xs font-bold text-black" id="recent-collection-text">Loading rent data...</p>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-bold text-black">
                            <i class="fa-solid fa-circle-exclamation text-sm text-red-500"></i>
                            <span id="units-due-list">Units Rent Due : Loading...</span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <button id="openOnboardModalBtn" class="border border-black bg-white hover:bg-gray-50 text-black font-bold text-xs px-4 py-2 rounded-full flex items-center gap-2 transition shadow-sm cursor-pointer">
                            <i class="fa-solid fa-square-plus"></i> Onboard New Tenant
                        </button>
                    </div>
                </div>

                <!-- Column 2: Pending Rent Breakdown & Empty Units -->
                <div class="space-y-6">
                    <div class="border border-black bg-white p-5 shadow-sm">
                        <h3 class="font-bold text-sm text-black mb-3 tracking-wide">Pending Rent Collection:</h3>
                        <div class="space-y-2 text-xs font-semibold text-gray-900" id="pending-rent-list"></div>
                    </div>

                    <div class="border border-black bg-white p-5 shadow-sm">
                        <h3 class="font-bold text-sm text-black mb-3 tracking-wide">Empty Units:</h3>
                        <div class="space-y-2.5 text-xs font-bold text-black" id="empty-units-container"></div>
                    </div>
                </div>

                <!-- Column 3: Recent Activity & Occupied Units -->
                <div class="space-y-6">
                    <div class="bg-[#FFE3E1] p-5 rounded-3xl border border-rose-200/60 shadow-sm">
                        <h3 class="font-bold text-sm text-black mb-3 text-center tracking-wide">Recent Activity</h3>
                        <div class="space-y-3 text-[11px] font-bold text-gray-900" id="landlord-activity-container"></div>
                    </div>

                    <div class="border border-green-400 bg-white p-5 shadow-sm">
                        <h3 class="font-bold text-sm text-black mb-3 tracking-wide">Occupied Units:</h3>
                        <div class="space-y-2.5 text-xs font-bold text-black" id="occupied-units-container"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Onboard Tenant Modal -->
    <div id="onboardModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-xs">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md mx-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Onboard New Tenant</h3>
            <form id="onboardTenantForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold mb-1">Full Name</label>
                    <input type="text" id="newTenantName" required class="w-full border p-2 text-xs rounded" placeholder="Jane Doe" />
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Email (Login Username)</label>
                    <input type="email" id="newTenantEmail" required class="w-full border p-2 text-xs rounded" placeholder="jane@example.com" />
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1">Temporary Password</label>
                    <input type="password" id="newTenantPassword" required class="w-full border p-2 text-xs rounded" placeholder="••••••••" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Unit Number</label>
                        <input type="text" id="newTenantUnit" required class="w-full border p-2 text-xs rounded" placeholder="C4" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Rent Amount (Ksh)</label>
                        <input type="number" id="newTenantRent" required class="w-full border p-2 text-xs rounded" placeholder="17000" />
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" id="closeOnboardModal" class="px-3 py-1.5 text-xs font-bold bg-gray-200 rounded cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-1.5 text-xs font-bold bg-blue-600 text-white rounded cursor-pointer">Add Tenant</button>
                </div>
            </form>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        async function loadLandlordData() {
            const data = await getKejaData();
            const { landlord = {}, tenants = [], allUnits = ["C5", "A3", "A1", "C4", "C3", "C1", "A4"] } = data;

            const welcomeBanner = document.getElementById('welcome-banner');
            if (welcomeBanner) {
                welcomeBanner.innerHTML = `Welcome Back ${landlord.name || 'Landlord'}!`;
            }

            const totalTenants = tenants.length;
            const paidTenants = tenants.filter(t => t.isPaid);
            const pendingTenants = tenants.filter(t => !t.isPaid);

            const paidPercentage = totalTenants > 0 ? Math.round((paidTenants.length / totalTenants) * 100) : 0;
            const pendingPercentage = 100 - paidPercentage;

            const pieDegrees = (paidPercentage / 100) * 360;
            const pieChartEl = document.getElementById('payment-pie-chart');
            if (pieChartEl) {
                pieChartEl.style.background = `conic-gradient(#86EFAC 0deg ${pieDegrees}deg, #FCA5A5 ${pieDegrees}deg 360deg)`;
            }

            document.getElementById('pie-paid-label').textContent = `Paid - ${paidPercentage}%`;
            document.getElementById('pie-pending-label').textContent = `Pending - ${pendingPercentage}%`;

            const recentTextEl = document.getElementById('recent-collection-text');
            if (recentTextEl) {
                recentTextEl.textContent = paidTenants.length > 0 
                    ? `Rent Collected: Ksh ${paidTenants[0].rentAmount.toLocaleString()} (Unit ${paidTenants[0].unit})`
                    : `No Rent Collected Yet This Month`;
            }

            const pendingUnits = pendingTenants.map(t => t.unit).join(', ');
            document.getElementById('units-due-list').textContent = `Units Rent Due : ${pendingUnits || 'None'}`;

            const pendingContainer = document.getElementById('pending-rent-list');
            let grandTotal = 0;
            const pendingHTML = pendingTenants.map(t => {
                grandTotal += Number(t.rentAmount || 0);
                return `<p><span class="font-bold">Unit ${t.unit} -</span> Amount: Ksh ${Number(t.rentAmount).toLocaleString()}</p>`;
            }).join('');

            pendingContainer.innerHTML = `
                ${pendingHTML || '<p class="text-gray-500">No pending rent!</p>'}
                <div class="border-t border-dashed border-gray-400 my-3"></div>
                <p class="text-sm font-black text-black pt-1 text-center">Grand Total:<br/>Ksh ${grandTotal.toLocaleString()}</p>
            `;

            const occupiedUnitCodes = tenants.map(t => t.unit);
            const emptyUnitCodes = allUnits.filter(u => !occupiedUnitCodes.includes(u));

            document.getElementById('occupied-units-container').innerHTML = occupiedUnitCodes.map(unit => `
                <div class="flex items-center gap-3">
                    <i class="fa-regular fa-circle-check text-green-600 text-base"></i>
                    <span>Unit ${unit}</span>
                </div>
            `).join('');

            document.getElementById('empty-units-container').innerHTML = emptyUnitCodes.map(unit => `
                <div class="flex items-center gap-3">
                    <i class="fa-regular fa-circle text-gray-600 text-sm"></i>
                    <span>Unit ${unit}</span>
                </div>
            `).join('');

            const activityContainer = document.getElementById('landlord-activity-container');
            const allActivities = tenants.flatMap(t => t.activities || []);
            activityContainer.innerHTML = allActivities.map(a => `
                <div class="flex items-start gap-2">
                    <input type="checkbox" ${a.completed ? 'checked' : ''} disabled class="mt-0.5 w-3.5 h-3.5 text-blue-600 rounded"/>
                    <p>${a.title}${a.subtitle ? `<br/><span class="text-gray-600 font-normal">${a.subtitle}</span>` : ''}</p>
                </div>
            `).join('') || '<p class="text-xs text-gray-500">No recent activity</p>';
        }

        const modal = document.getElementById('onboardModal');
        document.getElementById('openOnboardModalBtn').addEventListener('click', () => modal.classList.remove('hidden'));
        document.getElementById('closeOnboardModal').addEventListener('click', () => modal.classList.add('hidden'));

        document.getElementById('onboardTenantForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            try {
                const data = await getKejaData();
                
                const newTenant = {
                    id: 'T' + Date.now(),
                    name: document.getElementById('newTenantName').value.trim(),
                    email: document.getElementById('newTenantEmail').value.trim(),
                    password: document.getElementById('newTenantPassword').value,
                    unit: document.getElementById('newTenantUnit').value.trim(),
                    rentAmount: Number(document.getElementById('newTenantRent').value),
                    isPaid: false,
                    lastPaymentDate: "N/A",
                    nextDueDate: "2nd August, 2026",
                    activities: [
                        { title: `Onboarded into Unit ${document.getElementById('newTenantUnit').value.trim()}`, subtitle: "Just now", completed: true }
                    ]
                };

                data.tenants.push(newTenant);
                saveKejaData(data);

                alert(`Tenant ${newTenant.name} successfully onboarded to Unit ${newTenant.unit}!`);
                modal.classList.add('hidden');
                e.target.reset();
                await loadLandlordData(); // Refresh UI
            } catch (err) {
                console.error("Error onboarding tenant:", err);
                alert("Failed to onboard tenant. Check browser console for details.");
            }
        });

        document.addEventListener('DOMContentLoaded', loadLandlordData);
    </script>
</body>
</html>
