<!DOCTYPE html>
<html lang="en" class="m-0 p-0 h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KejaHub - Create Account</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html, body {
            margin: 0 ;
            padding: 0 ;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen m-0 p-0 flex flex-col">
    <!-- Header / Navbar -->
    <header class="w-full bg-white shadow-sm">
        <nav class="flex items-center px-6 py-4 gap-4 border-b border-gray-300">
            <img src="Assets/minh-pham-OtXADkUh3-I-unsplash.jpg" alt="KejaHub Logo" class="h-14 w-14 rounded-full object-cover">
            <p class="text-xl md:text-3xl font-bold tracking-tight text-gray-900">KejaHub</p>
        </nav>
    </header>

    <!-- Registration Form Container -->
    <main class="flex-grow flex justify-center items-center py-8 px-4">
        <div class="container mx-auto max-w-lg bg-gray-800 rounded-xl p-6 md:p-8 shadow-xl text-white">
            <div class="mb-6 text-center">
                <h2 class="font-bold text-2xl md:text-3xl tracking-wide">Create an Account</h2>
                <p class="text-sm md:text-base text-gray-300 mt-1">Join KejaHub as a Tenant or Landlord/Admin</p>
            </div>

            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm text-center font-medium"></div>

            <form id="registerForm" class="space-y-4">
                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-sm font-medium mb-1">Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                </div>

                <!-- Email Address -->
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium mb-1">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="+254 700 000 000" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                </div>

                <div>
                    <label for="role" class="block text-sm font-medium mb-1">Account Type</label>
                    <select id="role" required class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white">
                        <option value="" disabled selected>Select your account type</option>
                        <option value="tenant">Tenant (Looking for or renting a house)</option>
                        <option value="admin">Landlord / Property Admin</option>
                    </select>
                </div>

                <!-- Passwords -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="password" class="block text-sm font-medium mb-1">Password</label>
                        <input type="password" id="password" required minlength="6" placeholder="••••••••" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium mb-1">Confirm Password</label>
                        <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start space-x-2 pt-2">
                    <input type="checkbox" id="terms" required class="mt-1 w-4 h-4 rounded text-red-600 focus:ring-red-500">
                    <label for="terms" class="text-sm text-gray-300">
                        I agree to the <a href="#" class="text-red-400 hover:underline">Terms of Service</a> and <a href="#" class="text-red-400 hover:underline">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl transition duration-200 mt-2 cursor-pointer">
                    Create Account
                </button>

                <div class="text-center mt-6">
                    <a href="index.html" class="text-sm text-gray-300 hover:underline">
                        Already have an account? <span class="text-red-400 font-semibold">Sign In</span>
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, isError = true) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium ${
                isError ? 'bg-red-500/20 text-red-300 border border-red-500/50' : 'bg-green-500/20 text-green-300 border border-green-500/50'
            }`;
            alertBox.classList.remove('hidden');
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please check again.');
                return;
            }

            if (!role) {
                showAlert('Please select an account type.');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, role, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting...', false);

                    if (data.token) {
                        sessionStorage.setItem('authToken', data.token);
                        sessionStorage.setItem('userRole', role);
                    }

                    setTimeout(() => {
                        if (role === 'admin') {
                            window.location.href = 'LD.html';
                        } else {
                            window.location.href = 'TD.htm';
                        }
                    }, 1500);

                } else {
                    showAlert(data.message || 'Registration failed. Try again.');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('Server error. Please try again later.');
            }
        });
    </script>
</body>
</html>
