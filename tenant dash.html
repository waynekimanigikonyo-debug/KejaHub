<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.min.js"
        integrity="sha512-n/G+dROKbKL3GVngGWmWfwK0yPctjZQM752diVYnXZtD/48agpUKLIn0xDQL9ydZ91x6BiOmTIFwWjjFi2kEFg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>

<body>
    <header>
        <navbar class="flex justify-between m-4 items-center">
            <div>
                <h2 class="md:text-xl text-md font-semi">
                    <span><i class="fa-solid fa-home fa-xl" aria-hidden="true"></i></span>
                    Keja<span class="text-teal-400 md:text-xl">Hub</span>
                </h2>
            </div>
            <div class="flex space-x-6">
                <i class="fa-regular fa-circle-user fa-xl py-6"></i>
                <i class="fa-solid fa-bell fa-xl py-6" aria-hidden="true"></i>
                <p class="text-md md:text-2xl hover:underline items-center py-2">
                    Help
                </p>
            </div>
        </navbar>
    </header>

    <hero>
        <div class="text-bold text-xl md:text-2xl bg-slate-400 w-full tracking-wide">
            <h2>Welcome Back Alex!</h2>
            <br />
            <p>Tenant Dashboard</p>
            <p>Unit C5</p>
        </div>
    </hero>

    <main class="grid grid-row md:grid-rows-2 ">
        <aside class="m-4 bg-slate-600/20 py-6 flex flex-col m-4 gap-12 p-6 items-center w-16 min-h-screen rounded-lg">
            <i class="fa-solid fa-home inline-block p-6 rounded-full hover:bg-white fa-2xl mr-8"></i>
            <br />
            <i class="fa-solid fa-cog fa-2xl m-6inline-block p-6 rounded-full hover:bg-white fa-2xl mr-8"></i>
            <br />
            <i class="fa-solid fa-calendar fa-2xl m-6inline-block p-6 rounded-full hover:bg-white fa-2xl mr-8"></i>
            <br />
            <i class="fa-solid fa-users fa-2xl inline-block p-6 rounded-full hover:bg-white fa-2xl mr-8"></i>
        </aside>


        <div flex flex-row md:flex-rows-2>
            <canvas id="Rent Payment" width="400" height="100" aria-label="Hello ARIA World" role="img"></canvas>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script>
            const ctx = document.getElementById('Rent Payment');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
                    datasets: [{
                        label: '# of Votes',
                        data: [12, 19, 3, 5, 2, 3],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        </script>

        </>
</body>

</html>
