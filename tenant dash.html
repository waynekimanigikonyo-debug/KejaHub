<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KejaHub - Tenant Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden max-w-md w-full border border-gray-200 flex min-h-[850px]">
        
        <div class="w-16 bg-gray-50 border-r border-gray-200 flex flex-col items-center py-6 gap-8 text-xl text-gray-700">
            <button class="text-blue-600 border-l-4 border-blue-600 pl-2 w-full text-center"><i class="fa-solid fa-house"></i></button>
            <button class="hover:text-black transition"><i class="fa-solid fa-gear"></i></button>
            <button class="hover:text-black transition"><i class="fa-solid fa-calendar-days"></i></button>
            <button class="hover:text-black transition"><i class="fa-solid fa-users"></i></button>
            <button class="hover:text-black transition mt-auto"><i class="fa-solid fa-bell"></i></button>
        </div>

        <div class="flex-1 p-5 flex flex-col justify-between overflow-y-auto">
            
            <div>
                <div class="flex justify-between items-start mb-4">
                    <div class="flex items-center gap-2 font-bold text-xl text-gray-900">
                        <i class="fa-solid fa-house-chimney text-2xl text-blue-600"></i>
                        <span>Keja<span class="text-cyan-600">Hub</span></span>
                    </div>
                    <div class="flex items-center gap-1 text-gray-700 font-semibold cursor-pointer">
                        <i class="fa-solid fa-user-circle text-lg"></i> Help <i class="fa-solid fa-caret-down text-xs"></i>
                    </div>
                </div>

                <div class="bg-gray-200 p-3 rounded-md mb-4 text-xs font-semibold text-gray-800 space-y-0.5">
                    <p>Welcome back Alex!</p>
                    <p>Tenant Dashboard</p>
                    <p>Unit C5</p>
                </div>

                <div class="mb-5 text-center">
                    <p class="text-xs font-semibold text-gray-600 mb-2">Rent Payment</p>
                    <div class="flex items-end justify-center gap-2 h-16 px-4 border-b border-gray-300">
                        <div class="w-2 h-12 bg-red-500 rounded-t-sm" title="Jan"></div>
                        <div class="w-2 h-14 bg-green-500 rounded-t-sm" title="Feb"></div>
                        <div class="w-2 h-10 bg-red-500 rounded-t-sm" title="Mar"></div>
                        <div class="w-2 h-16 bg-green-500 rounded-t-sm" title="Apr"></div>
                        <div class="w-2 h-14 bg-green-500 rounded-t-sm" title="May"></div>
                        <div class="w-2 h-16 bg-green-500 rounded-t-sm" title="Jun"></div>
                    </div>
                    <p class="text-[10px] text-gray-500 mt-1">Rent Paid</p>
                    <div class="flex justify-center gap-3 text-[9px] font-bold text-gray-600 mt-1">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 inline-block rounded-sm"></span> Rent Paid</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-red-500 inline-block rounded-sm"></span> Not Paid</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-black inline-block rounded-sm"></span> Series C</span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-md mb-4 space-y-3">
                    <h4 class="text-center font-bold text-xs uppercase tracking-wider text-gray-800">Payments and Rent</h4>
                    <div class="flex items-center gap-3 text-xs">
                        <div class="bg-blue-500 text-white rounded p-0.5 w-5 h-5 flex items-center justify-center">
                            <i class="fa-solid fa-check text-[10px]"></i>
                        </div>
                        <p class="font-bold text-gray-900">Rent Paid : Ksh 25,000 <br><span class="text-gray-500 font-normal">July 2nd 2026</span></p>
                    </div>
                    <div class="flex items-start gap-3 text-xs border-t pt-2 border-gray-100">
                        <i class="fa-solid fa-bell text-gray-800 mt-0.5 text-base w-5 text-center"></i>
                        <p class="font-bold text-gray-900">Next Payment Due : <br><span class="text-gray-500 font-normal">August 2nd 2026</span></p>
                    </div>
                    <div class="text-center pt-1">
                        <button class="bg-gray-100 border border-gray-300 text-gray-700 text-[11px] font-bold px-3 py-1 rounded-full hover:bg-gray-200 transition">
                            <i class="fa-solid fa-bell-ring"></i> Set Rent reminder
                        </button>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-3 border border-gray-200 mb-4 text-xs">
                    <h4 class="text-center font-black tracking-wider text-gray-700 mb-2 uppercase text-[10px]">Utilities</h4>
                    <div class="space-y-1.5 font-bold text-gray-800">
                        <div class="flex justify-between items-center px-2">
                            <span><i class="fa-solid fa-droplet text-blue-500 mr-2"></i>Water Bill:</span>
                            <span>Ksh 2,300</span>
                        </div>
                        <div class="flex justify-between items-center px-2">
                            <span><i class="fa-solid fa-bolt text-yellow-500 mr-2"></i>Electric Bill:</span>
                            <span>Ksh 700</span>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button class="bg-red-600 text-white text-[10px] font-bold px-4 py-1.5 rounded-md hover:bg-red-700 transition shadow-sm">
                            Set Reminder For Utilities
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <h4 class="text-center font-bold text-sm text-gray-900 mb-2">Quick Actions</h4>
                <div class="space-y-1 text-xs text-gray-800 font-medium">
                    <button class="w-full text-left py-2 px-1 hover:bg-gray-50 flex items-start gap-2.5 transition">
                        <i class="fa-solid fa-scissors text-sm mt-0.5"></i>
                        <div>
                            <p class="font-bold uppercase text-[11px]">Submit Maintenance Request</p>
                            <p class="text-[10px] text-gray-500">Tap to open form for repairs / issues</p>
                        </div>
                    </button>
                    <button class="w-full text-left py-2 px-1 hover:bg-gray-50 flex items-center gap-2.5 transition border-t border-gray-100">
                        <i class="fa-solid fa-comment-dots text-sm"></i>
                        <span class="font-bold text-[11px]">Message <span class="font-normal text-gray-600">The Landlord</span></span>
                    </button>
                    <button class="w-full text-left py-2 px-1 hover:bg-gray-50 flex items-center gap-2.5 transition border-t border-gray-100">
                        <i class="fa-solid fa-user-pen text-sm"></i>
                        <span class="text-[11px]">Update Personal Details</span>
                    </button>
                    <button class="w-full text-left py-2 px-1 hover:bg-gray-50 flex items-center gap-2.5 transition border-t border-gray-100">
                        <i class="fa-solid fa-file-pdf text-sm text-red-500"></i>
                        <span class="text-[11px] uppercase text-gray-600 font-bold">View Lease Agreement PDF Link</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
