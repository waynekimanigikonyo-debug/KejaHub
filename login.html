<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header>
        <div>
        <div>
        <nav class="flex items-center m-4 gap-4 border-b-2 border-black pb-2 ">
            <image src="Assets/Etienne-Beauregard-Riverin-B0aCvAVSX8E-unsplash.jpg" class="h-16 w-20 rounded-full md:h-32 md:w-32  "></image>
            <p class="text-lg md:text-3xl items-center space-x-4 text-left">KejaHub</p>
        
          
        </nav>
       
    </div>
    </header>
    
    <main class="flex md:flex-cols-2 ">

        <div class="container mx-auto max-w-md bg-gray-300 ">
            <div class="m-4">
            <h2 class="font-bold text-xl md:text-2xl tracking-wide text-center">Welcome Back!</h2>
            <p class="font-semi text-xl md:text-2xl tracking-wide text-center">Sign in to your KejaHub account</p>
            </div>
        
            <div>
                <form class="container items-center justify-center m-4 py-4 space-y-4 text-white">
                <label for="email" class="block" class="text-md font-semi md:text-xl ">Email / Username</label>
                <input type="email" id="email" placeholder="Enter Your Email address" class="border border-slate-200 px-6 py-4 md:w-[400px] rounded-xl">

                <label for="password" class="flex justify-between items-center ">Password <span class="text-red-500 hover:underline mr-6">Forgot Password?</span></label>
                <input type="password" id="password" placeholder="****************"class="border border-slate-200 px-6 py-4 md:w-[400px] rounded-xl items-center justify-center">
                <button class=" block bg-red-700 px-10 py-3 justify-center items-center md:w-[300px] rounded ml-16">Login</button>
                <checkbox class="flex  items-center space-x-4">
                    <input type="checkbox" id="remember" class="mr-2">
                    <label for="remember" class="text-md font-semi md:text-xl ">Keep me signed in for 30 Days</label>
                </checkbox>
             
                <button class="bg-slate-600 py-3 px-6 md:w-[300px] text-black font-bold text-xl rounded ml-16 ">SIGN IN</button>
                <p class="text-center">OR</p>

               <div class="flex items-center justify-center ">
                <image src="/Assets/google.jpg" class="h-[50px]"></image>
                <p class="border px-4 py-3 bg-white text-black border-white">Continue with google</p>
               </div>

               <div class="text-center mb-4">
                <a href="" class="hover:underline text-black">Don't have an account? Create one for Free</a>
               </div>
                </form>
            </div>
        </div>
    </div>
    </main>
    

</body>
</html>
