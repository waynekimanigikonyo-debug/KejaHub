<!DOCTYPE html>
<html lang="en" class="m-0 p-0 h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KejaHub - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen m-0 p-0 flex flex-col">
    <!-- Header / Navbar -->
    <header class="w-full bg-white shadow-sm">
        <nav class="flex items-center px-6 py-4 gap-4 border-b border-gray-300">
            <img src="/Assets/minh-pham-OtXADkUh3-I-unsplash.jpg" alt="KejaHub Logo" class="h-14 w-14 rounded-full object-cover">
            <p class="text-xl md:text-3xl font-bold tracking-tight text-gray-900">KejaHub</p>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex justify-center items-center py-8 px-4">
        <div class="container mx-auto max-w-md bg-gray-800 rounded-xl p-6 md:p-8 shadow-xl text-white">
            <div class="mb-6 text-center">
                <h2 class="font-bold text-2xl md:text-3xl tracking-wide">Welcome Back!</h2>
                <p class="text-sm md:text-base text-gray-300 mt-1">Sign in to your KejaHub account</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">Email / Username</label>
                    <input type="email" id="email" required placeholder="Enter Your Email address" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="text-sm font-medium">Password</label>
                        <a href="#" class="text-xs text-red-400 hover:underline">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full border border-slate-600 bg-gray-700 px-4 py-3 rounded-xl focus:outline-none focus:border-red-500 text-white placeholder-gray-400">
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded text-red-600 focus:ring-red-500">
                    <label for="remember" class="text-sm text-gray-300">Keep me signed in for 30 Days</label>
                </div>

                <button type="submit" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-xl transition duration-200 mt-2 cursor-pointer">
                    Sign In
                </button>

                <div class="text-center mt-6">
                    <a href="register.html" class="text-sm text-gray-300 hover:underline">
                        Don't have an account? <span class="text-red-400 font-semibold">Create one for Free</span>
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const storage = remember ? localStorage : sessionStorage;

            const ADMIN_EMAIL = 'admin@kejahub.com';
            const ADMIN_PASSWORD = 'admin123';

            const TENANT_EMAIL = 'tenant@kejahub.com';
            const TENANT_PASSWORD = 'tenant123';

            if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                storage.setItem('userRole', 'admin');
                window.location.href = 'landlord dash.html';
            } 
            else if (email === TENANT_EMAIL && password === TENANT_PASSWORD) {
                storage.setItem('userRole', 'tenant');
                window.location.href = 'tenantdash.html';
            } 
            else {
                alert('Invalid email or password. Please check your credentials.');
            }
        });
    </script>
</body>
</html>
